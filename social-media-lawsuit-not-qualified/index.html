    <style>
        :root {
            --navy: #0f2740;
            --blue: #1b5fa7;
            --white: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #dbe4ee;
            --gray: #eef2f7;
            --shadow: 0 14px 34px rgba(15, 39, 64, 0.12);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f6f9fc;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            width: min(100%, 560px);
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 34px 26px;
            text-align: center;
        }
        .badge {
            display: inline-block;
            margin-bottom: 16px;
            padding: 8px 12px;
            border-radius: 999px;
            background: var(--gray);
            color: var(--blue);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        h1 {
            color: var(--navy);
            font-size: clamp(28px, 5vw, 42px);
            line-height: 1.08;
            margin-bottom: 14px;
        }
        p {
            color: var(--muted);
            font-size: 18px;
            margin-bottom: 18px;
        }
        .note {
            font-size: 15px;
            margin-bottom: 24px;
        }
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 52px;
            width: 100%;
            max-width: 300px;
            padding: 14px 24px;
            border-radius: 12px;
            background: var(--blue);
            color: var(--white);
            text-decoration: none;
            font-weight: 700;
            font-size: 17px;
        }
    </style>
